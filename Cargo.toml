[package]
name = "ecpay"
version = "0.4.0"
edition = "2021"
rust-version = "1.89"
description = "ECPay (綠界科技) payment SDK in Rust — AIO payments, B2C/B2B e-invoice, ECPG 站內付 2.0, and logistics; ported from the official SDKs and stage-verified"
license = "MIT"
repository = "https://github.com/at-least/ecpay-rs"
readme = "README.md"
keywords = ["ecpay", "payment", "invoice", "taiwan", "fintech"]
categories = ["api-bindings", "finance"]
exclude = [".claude/"]

[dependencies]
aes = "0.9"
base64 = "0.22"
cbc = { version = "0.2", features = ["alloc"] }
encoding_rs = "0.8"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
    "charset",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = { version = "2", default-features = false }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
chrono = "0.4"
proptest = "1.9.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
