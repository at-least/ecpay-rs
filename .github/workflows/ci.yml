name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Fully offline: every live-stage suite is #[ignore]d.
      - run: cargo test --all-targets
      # Live E2E against ECPay's stage server (public test accounts): the
      # four sandbox suites, via -- --ignored, at the default parallelism the
      # first three always ran at (sandbox_ecpg's unique_no carries a
      # per-process counter; its 5 tests were verified in a parallel run).
      # stage_smoke / stage_probes stay a manual run (see README).
      - run: cargo test --test sandbox --test sandbox_b2b --test sandbox_logistics --test sandbox_ecpg -- --ignored
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  # Supply-chain check: RustSec advisories against the dependency graph.
  # Cargo.lock is not tracked (library crate), so resolve it first — the
  # audit then covers exactly the versions CI is about to build with.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo generate-lockfile
      - run: cargo audit
  # The remaining live suites (stage_smoke / stage_probes) stay OUT of the
  # automatic runs: they print raw server answers and the probes create
  # REAL stage-side records (logistics orders, B2B invoices consuming 字軌
  # numbers, never cancelled). They run ONLY on a manual workflow_dispatch
  # (Actions tab -> CI -> Run workflow; the `if:` below skips this job on
  # push/PR events), so their stage parity cannot silently rot either.
  stage-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Probes must run serially (see tests/stage_probes.rs header).
      - run: cargo test --test stage_smoke -- --ignored --nocapture
      - run: cargo test --test stage_probes -- --ignored --test-threads=1 --nocapture
