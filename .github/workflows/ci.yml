name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Fully offline: every live-stage suite is #[ignore]d.
      - run: cargo test --all-targets
      # Live E2E against ECPay's stage server (public test account), the
      # same three sandbox suites CI always ran — now via -- --ignored.
      # stage_smoke / stage_probes stay a manual run (see README).
      - run: cargo test --test sandbox --test sandbox_b2b --test sandbox_logistics -- --ignored
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
