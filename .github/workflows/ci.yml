name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The monthly cron drives the two scheduled stage jobs: stage-smoke (AIO
  # smoke — no logistics orders or 字軌 consumed, though it does register
  # pending checkout trades, the same residue class as sandbox_ecpg) and
  # stage-sandbox (the five sandbox suites — three logistics orders plus one
  # B2B 字軌 number per run). The `test` job is offline only and carries no
  # live step; this is the accepted cadence.
  schedule:
    - cron: "0 18 4 * *" # monthly, 4th 18:00 UTC (= 台灣時間 5 日 02:00)

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Fully offline: every live-stage suite is #[ignore]d.
      - run: cargo test --all-targets
      # --all-targets skips the Doc-tests phase entirely; run the four
      # compile_fail pins (deprecated Ecpay fields, EmptyCiphertext) and
      # every rustdoc example explicitly.
      - run: cargo test --doc
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  # rust-version = "1.89" is asserted metadata; this job makes it true.
  # Dependency floors that need a newer rustc fail HERE (no lockfile — the
  # job resolves fresh), which is real MSRV signal, not a flake: fix it by
  # pinning the offending dependency floor in Cargo.toml.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
  # Supply-chain check: RustSec advisories against the dependency graph.
  # Cargo.lock is not tracked (library crate), so resolve it first — the
  # audit then covers exactly the versions CI is about to build with.
  # NOTE: each run resolves fresh from the version requirements, so a red
  # audit can be a NEW upstream advisory against an OLD requirement — not
  # necessarily a regression introduced by the PR it failed on.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo generate-lockfile
      - run: cargo audit
  # The AIO smoke answers queries and registers pending checkout trades on
  # the stage account (no logistics orders, no 字軌 consumed), so it also
  # runs on the monthly schedule, keeping its stage parity from rotting
  # between manual runs.
  stage-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test stage_smoke -- --ignored --nocapture
  # Live E2E against ECPay's stage server (public test accounts): the five
  # sandbox suites, via -- --ignored, at the default parallelism the first
  # four always ran at (sandbox_ecpg's unique_no carries a per-process
  # counter; its tests were verified in a parallel run).
  #
  # Gated like stage-smoke rather than running in `test`, because these
  # suites mint PERMANENT stage records: three logistics orders per run that
  # nothing can remove (ECPay has no B2C cancel endpoint at all, and
  # Express/CancelC2COrder needs the CVSPaymentNo/CVSValidationNo an
  # unconfirmed OTP order never obtains — see the judged-rejection test in
  # tests/sandbox_logistics.rs), plus one B2B 字軌 number. Running that on
  # every push AND every pull_request accrued residue on each branch update
  # for coverage that only changes when stage does; monthly + on demand
  # keeps the drift signal at a fraction of the cost.
  #
  # --nocapture so the raw server answers land in the run log: these suites
  # are how this repo captures server truth, and cargo swallows stdout for
  # passing tests otherwise.
  stage-sandbox:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test sandbox --test sandbox_b2b --test sandbox_logistics --test sandbox_ecpg --test sandbox_payment -- --ignored --nocapture
  # The probes print raw server answers AND create REAL stage-side records
  # (logistics orders, B2B invoices consuming 字軌 numbers, never cancelled),
  # so they run ONLY on a manual workflow_dispatch (Actions tab -> CI ->
  # Run workflow; the `if:` below skips this job on push/PR/schedule events).
  stage-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Probes must run serially (see tests/stage_probes.rs header).
      - run: cargo test --test stage_probes -- --ignored --test-threads=1 --nocapture
